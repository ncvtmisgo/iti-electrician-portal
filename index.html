<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DGT / NCVT ITI Electrician Certificate & Modern Marksheet Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QRious Library for generating QR Codes -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        @media print {
            body * { visibility: hidden; }
            #printable-area, #printable-area * { visibility: visible; }
            #printable-area { position: absolute; left: 0; top: 0; width: 100%; }
            .no-print { display: none !important; }
        }
        .cert-box {
            border: 6px double #1e3a8a;
            background: #fffdf9;
        }
        .marksheet-box {
            background: #ffffff;
            border: 1px solid #cbd5e1;
        }
    </style>
</head>
<body class="bg-slate-100 text-gray-800 font-sans antialiased">

            <h1 class="text-xl font-bold">DGT / NCVT ITI Digital Portal & Verification</h1>
            <div class="flex gap-2 mt-2 md:mt-0">
                <button onclick="switchTab('generator')" class="px-4 py-2 bg-blue-700 hover:bg-blue-600 rounded text-sm font-semibold transition">Generate Documents</button>
                <button onclick="switchTab('verify')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded text-sm font-semibold transition">QR Verification Portal</button>
            </div>
        </div>
    </header>

                    </div>
                    <div>
